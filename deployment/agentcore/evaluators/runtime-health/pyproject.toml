[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "purchase-behavior-runtime-health-evaluator"
version = "0.1.0"
description = "AgentCore code-based evaluator for simulator runtime health"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
  "bedrock-agentcore==1.21.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
